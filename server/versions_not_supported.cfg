# Client versions the server turns away, and what those players are told.
#
#   <rule> | <message>
#
# A rule is an exact version (0.5.1-preview) or a comparison (<6, <=0.4.2).
# The first rule that matches wins. Changes apply as soon as the file is saved.
#
# The server refuses every signed-in request from a listed version, so this is enforced and not
# just a message. Only v6 and later ever talk to the server: 0.4.2 to 0.5.1 learn about updates
# from the GitHub releases page instead, and anything older checks nothing at all.

# Build 46 let players put an update off (a LATER button). That option is gone, by the user's decision, so 46 and
# everything before it is turned away: keep this at 47 or above.
<47 | This version of AstroArena is no longer supported. Please update to the newest build.
