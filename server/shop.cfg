# The daily offers. Every day the server picks a few of these for the shop; each player can buy each
# one once that day, and the shop changes again at midnight (this computer's clock).
# Changes apply as soon as the file is saved.
#
# Every [section] is one possible offer; its name is the title players see (24 characters at most).
#   bolts, prisms        what the offer gives
#   fighter              a fighter it unlocks (BYTE, BRAKK, MIRA, KITO, VARUN)
#   skin_fighter, skin   a colourway it gives (the fighter, and which one: 1 or 2)
#   currency             what it is paid with: PRISMS, BOLTS or FREE
#   price                how much
#   was                  an optional higher price, shown crossed out with a discount badge
#   theme                the card's colour, 0 to 5

[settings]
offers_per_day = 3

