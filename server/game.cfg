# Who is in charge of what. Changes apply as soon as the file is saved.

[players]
# The bot difficulty a player has until they pick another: EASY, NORMAL, HARD or ELITE.
difficulty = EASY
# The difficulties players may pick. The game asks the server when a player chooses one, and the
# server says yes only to these. (Developers may pick any.)
allowed = EASY, NORMAL, HARD, ELITE

[developers]
# Developers can switch on the debug menu (drop luck, free upgrades, hand-outs), make shop
# deals, and start an account over. Everyone else has none of that.
#   everyone = yes   turns it on for every player
#   ids              the player ids that are developers, separated by commas.
#                    A player's id is shown in the game under Settings > Data.
everyone = no
ids = f5c75a1aa787e6e1

[accounts]
# The first save a new account uploads decides its starting Cups and Glitch Drops,
# so progress made before the server existed carries over. Set to no once
# everyone has moved over: new accounts then start from zero.
import_saves = yes
# New accounts one address may create per hour.
per_address_per_hour = 10
