# The News tab. Each section is one item; its name is the headline players see.
#
#   date     shown beside the headline, as written (2026-10-05)
#   tag      a short label: NEW, BALANCE, EVENT, FIX or NEWS (the default)
#   text     the item itself. Indent continuation lines to carry on over several lines.
#
# The newest goes first: items are shown in the order they are written here.
# Changes apply as soon as the file is saved.

[Varun comes down to earth]
date = 2026-10-09
tag = BALANCE
text = Varun is now a Rare fighter: 2,500 Credits on the Spark Road, right after Bark. He has 4,800 health, his
    six rockets do 1,300 together, Rocket Rain does half the damage it did, and Five Alarm lasts 4 seconds.
    Buddy reloads faster, and his computers smash like glass on whoever they hit. Running out of ammo has a soft
    click of its own instead of the error buzz. Kito's hammer flies straight at the enemy, head first.
    In an Arena Box one item is now one thing, the jackpot included, and the announcer is gone. The Training
    Area's targets have half the health.

[Bark, plain boxes and a hammer you can see]
date = 2026-10-09
tag = NEW
text = Brakk is now called Bark, and he sounds like it: his attack is a bark of his own, and he flings a front
    paw for each paw print. Kito leaps as he hurls his hammer, the hammer flies up and over, and the aiming
    circle now stops on the first enemy in its way. Faultline reaches a little less far.
    Arena Boxes are plain boxes now, with no rarities: three items, and with luck a few bonus ones. They also
    have an announcer. Buddy has a voice of his own.
    Choosing a fighter takes you straight back to the home screen, the Settings button is no longer squeezed,
    and in the Training Area your super starts charged.

[A new look, a dog, a hammer and no more shields]
date = 2026-10-09
tag = NEW
text = The menus have a new look: steel blue instead of purple, with panels that stand off the screen.
    Brakk is a dog now. He throws paw prints a long way, two at a time, and each takes a fifth of the health its
    target has left. Kito has 8,000 health and four blades worth 2,200, and his new super, Faultline, hurls a
    giant hammer: the ground quakes in every direction where it lands, and stays cracked.
    Buddy throws two computers instead of one. His poison reaches a quarter less far and wears off after 6
    seconds, sooner on a boss. Byte and Buddy have more health, and Byte hits harder.
    Shields are gone, and healing only starts after three seconds without attacking or being hit.
    Mira has left the arena: if you had her, her 4,200 Credits are back on your Spark Road.

[Arena Boxes]
date = 2026-10-08
tag = NEW
text = Glitch Drops are now Arena Boxes, and every drop you were holding has become one. A box holds three items
    or more, up to eight, and each has a rarity of its own: tap to open it, then go through what is inside while
    the counter in the corner tells you how many items remain. Boxes no longer split; they pay with what is in them.

[Buddy throws further]
date = 2026-10-08
tag = BALANCE
text = Buddy's Hardware Fault is now a whole desktop computer hurled right across the arena: it smashes into the
    first enemy in its way. When his Malformed Build poisons someone, zeros and ones stream up over their head for
    as long as it runs. And the Spark Road asks 9,000 Credits for an Ultra fighter, down from 13,000.

[Chaos Mode]
date = 2026-10-07
tag = NEW
text = Offline mode is now Chaos Mode: on your offline profile every tweak in the game is yours. Drop luck, endless
    drops, free upgrades, no level cap, hand-outs, your own shop deals. It only changes your offline profile, and
    the tweaks switch off when you go back online. You can go offline whenever you like, even with the server
    there: Settings > Modes > Offline mode.

[Offline mode that counts]
date = 2026-10-07
tag = NEW
text = When the server can't be reached the game now switches by itself to an offline profile kept on your device.
    It is a separate account with its own Cups, Glitch Drops, currencies and fighters, and everything works in it:
    matches pay, drops open, the shop sells. Your server account is untouched, and the game goes back to it by
    itself when the server answers. Nothing from the offline profile is sent to the server.

[Buddy has gone rogue]
date = 2026-10-07
tag = NEW
text = A new Ultra fighter waits at the end of the Spark Road: Buddy, an AI that went rogue. He smashes a whole
    computer into whoever is close, for the hardest single hit in the game. His super needs no aiming: it picks
    the nearest enemy in sight and compiles malformed code into them, a poison that stops their healing and
    never lets up until they are knocked out.

[A Spark Road you can walk down, and new money]
date = 2026-10-07
tag = NEW
text = The Spark Road is now a real 3D road: drag along it to see every fighter waiting on it. Fill its Credit bar
    and the fighter unlocks on the spot, with nothing to claim (Rare 2,500 Credits, Epic 4,200, Mythic 6,500,
    Legendary 9,000, Ultra 13,000). Spark Drops are now Glitch Drops, and they give twelve times the Credits
    they used to. Power Ups are now Upgrade Credits, which pay for every upgrade, and Crystals are now CPU Chips.
    The Spark Pass and Glory are gone: any Glory you had was paid out as Upgrade Credits.

[Team up: Boss Mode and 3v3 with friends]
date = 2026-10-06
tag = NEW
text = Tap TEAM UP on the home screen to play with one or two friends on this server. One of you makes a team
    and gets a four-digit code; the others type it in, and the leader presses Play. In Boss Mode you fight
    the boss together (it is tougher for every extra player). In Knockout Rush you are one side of the 3v3,
    with a bot making up the third if there are two of you. Matches pay Cups as usual, and leaving one
    counts as a defeat for whoever left.

[Byte is the new starter]
date = 2026-10-06
tag = NEW
text = Juno has left the arena, and Byte takes her place as the fighter everyone starts with. Her rifle fires a
    scatter of five bits, her super is a wide blast that shoves back whoever it hits, and her hyper speeds
    up her shots. Juno's levels and Cups went with her; everyone has Byte at level 1.

[1v1 is played for Cups]
date = 2026-10-06
tag = NEW
text = 1v1 is no longer a test mode. The winner takes Cups and the loser gives some up, for the player and for the
    fighter they played. The server replays every 1v1 from both players' inputs and decides who won; leaving a
    match, or letting it stall, counts as a defeat.

[Ranks without end, and Cups that fly]
date = 2026-10-06
tag = NEW
text = A fighter's rank no longer stops at 20: past 1,000 Cups every 150 more is another rank, for as long as
    you keep winning. And the Cups a match pays now fly across the result screen into your total.

[Disabled accounts]
date = 2026-10-06
tag = NEW
text = The server's owner can now disable an account. If that happens to yours, the game tells you so, with the
    reason and how long it lasts if the owner gave them. A disabled account can't play at all, online or
    offline, until it is let back in.

[Boss Mode pays Cups]
date = 2026-10-06
tag = NEW
text = Beating a boss now earns Cups, for you and for the fighter you played. Losing to one costs nothing.

[1v1: the server decides what happened]
date = 2026-10-05
tag = FIX
text = If a 1v1 stops moving, the server now says why: the player whose game stopped responding loses, the other
    wins, and if the connection simply went the match is called off. Before, both players could be told they
    had won. The same account can no longer be matched against itself, and a waiting player is told when the
    only other player waiting is on a different build.

[An even fight]
date = 2026-10-05
tag = BALANCE
text = Every fighter now has at least 5,600 health and does at least 1,500 damage with one full ammo. Varun
    stands above that, at 6,500 health and 2,500 an ammo.

[1v1: play a real player]
date = 2026-10-05
tag = NEW
text = A new mode, 1v1, puts you against one other real player on this server, each on your own device. First
    to 3 knockouts, two minutes on the clock. Pick it and wait: the match starts when someone else picks it too.
    It is a test mode for now, so nothing is earned or lost in it.

[Varun, buffed again, with real rockets]
date = 2026-10-05
tag = BALANCE
text = More health (5,200 at level 1), 340 damage a rocket, 1,200 a rocket in the rain, and his super and hyper
    both charge faster. His rockets now look like rockets, with a launch and a blast sound of their own.

[Varun hits harder, and you aim his Rocket Rain]
date = 2026-10-05
tag = BALANCE
text = Rocket Rain now lands where you aim it: all eight rockets come down inside one big circle, and the
    reticle shows the arc they fly and the circle they fall in. Tap the button and it still picks the nearest
    enemy for you.
    Varun also has more health, harder-hitting and faster rockets with a bigger burst, a quicker reload and a
    super that charges sooner.

[Cups by placing, and a rank for every fighter]
date = 2026-10-05
tag = NEW
text = Cups no longer depend on how hard the bots are. Last Spark pays 25, 22, 20, 17, 14, 12, 7 and 3 Cups for
    1st to 8th place, and nothing is lost for finishing 9th or 10th.
    Every fighter now has Cups of its own and a rank that follows them, from 1 up to MAX at 1,000 Cups. The
    result screen shows your fighter ranking up.

[Varun gets a hyper of his own]
date = 2026-10-05
tag = NEW
text = Five Alarm lasts 14 seconds: his rockets fly faster and his super charges half as fast again. Hits landed
    during any hyper now charge the next one, so you can go from one straight into another.
    A running hyper sets the fighter alight, and aiming Varun's super shows where his rockets will come down.

[Varun joins the fight]
date = 2026-10-05
tag = NEW
text = A Legendary rocket firefighter, last stop on the Spark Road. Rocket Pack fires six rockets that burst
    where they land; Rocket Rain sends eight into the sky to come down on every enemy in sight. He is the first
    fighter with a voice.

[Shields and Ramrod]
date = 2026-10-05
tag = BALANCE
text = Shields are a quarter of a fighter's health, build only when you haven't been hit for three seconds, and
    are gone from Boss Mode. Ramrod's charge is shorter, slower and hits less hard.
