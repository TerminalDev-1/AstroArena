# How bots behave at each difficulty. The game has the same numbers built in and
# uses those whenever the server can't be reached, so this file only needs the
# values you want to change. Difficulty never changes a bot's health or damage.
#
#   reactiontime      seconds a target must be visible before the bot shoots
#   thinkinterval     seconds between decisions
#   aimerrordegrees   how far off its aim can be
#   leadfactor        0 = aims where you are, 1 = aims where you will be
#   dodgechance       chance to sidestep an incoming shot
#   rangediscipline   0 = runs straight at you, 1 = keeps its weapon's ideal distance
#   retreatbelow      retreats to heal below this fraction of health (0 = never)
#   focusweakest      true = prefers hurt targets
#   shotdiscipline    true = only fires when the shot can land
#   superskill        0..1 how well it times its super
#   firehesitation    extra random delay between shots, seconds
#   wander            aimless drift
#   teamwork          how much it sticks with teammates

