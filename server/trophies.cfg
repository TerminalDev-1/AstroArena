# The Cups each mode pays. Changes apply as soon as the file is saved, from the next match that
# finishes: no restart, and no new build of the game (it shows whatever the server awards).
#
# Each section is a mode: LAST_SPARK, KNOCKOUT_RUSH, BOSS or DUEL (1v1). A fighter wins and loses the same
# Cups as the player who plays it. Leave a line out and the built-in number is used.
#
#   places      Cups by finishing place, first to last, separated by commas. A mode with places
#               is paid by place and nothing else below applies to it.
#   win         Cups for a victory.
#   mvp_bonus   extra Cups for winning as the match's MVP.
#   draw        Cups for a draw.
#   max_loss    the most a defeat costs. 0 = a defeat costs nothing.
#   loss_step   a defeat costs 1 Cup for every this many Cups the player has, up to max_loss,
#               so beginners lose nothing. 0 = every defeat costs max_loss.
#
# Cups never go below zero, and they don't depend on the bot difficulty.
# The Training Area is never played for Cups. A 1v1 is two real players: one's win is the other's
# defeat, and whoever leaves or stops responding takes the defeat.

[LAST_SPARK]
places = 25, 22, 20, 17, 14, 12, 7, 3, 0, 0

[KNOCKOUT_RUSH]
win = 8
mvp_bonus = 2
draw = 1
max_loss = 6
loss_step = 80

